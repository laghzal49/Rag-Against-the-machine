[project]
name = "rag-against-the-machine"
version = "1.0.0"
description = "Mandatory codebase RAG pipeline for the 42 curriculum"
requires-python = ">=3.10"
dependencies = [
  "fire>=0.7,<0.8",
  "pydantic>=2.10,<3",
  "tqdm>=4.67,<5",
  "transformers>=4.51,<5",
  "torch>=2.6,<3",
  "tree-sitter>=0.26.0",
  "tree-sitter-python>=0.25.0",
]

[dependency-groups]
dev = ["flake8>=7,<8", "mypy>=1.15,<2", "types-tqdm"]

[tool.mypy]
exclude = ["^data/", "^\\.venv/"]

[tool.ruff]
line-length = 79
exclude = [
  ".venv",
  "data",
  ".git",
  "__pycache__",
]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E203"]


[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
